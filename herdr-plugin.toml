# githerd: which git repos under a root are uncommitted, ahead or behind,
# in Herdr's sidebar.
id = "githerd"
name = "githerd"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Uncommitted, ahead and behind state of every git repo under a root"
platforms = ["linux", "macos"]

# Runs at install and update. It needs Go on the PATH of the shell that
# runs `herdr plugin install`.
[[build]]
command = ["go", "build", "-o", "bin/githerd", "."]

# Herdr restores no tokens after a restart, so report them again.
[[startup]]
command = ["./bin/githerd", "herdr", "sync"]

# Herdr has no timers: these hooks keep the sidebar tokens current.
[[events]]
on = "workspace.created"
command = ["./bin/githerd", "herdr", "sync"]

[[events]]
on = "workspace.closed"
command = ["./bin/githerd", "herdr", "sync"]

[[events]]
on = "workspace.focused"
command = ["./bin/githerd", "herdr", "sync"]

# The sync acts only when the agent turned done or idle.
[[events]]
on = "pane.agent_status_changed"
command = ["./bin/githerd", "herdr", "sync"]

# Focuses the rail of the current workspace, or opens one beside the
# focused pane. Bind it in config.toml:
#   [[keys.command]]
#   key = "prefix+g"
#   type = "plugin_action"
#   command = "githerd.rail"
[[actions]]
id = "rail"
title = "githerd rail"
contexts = ["workspace"]
command = ["./bin/githerd", "herdr", "rail"]

# Runs the sync as the hooks do, with this plugin's binary, state dir and
# lock. A tab_bar_right command entry in config.toml can invoke it as a
# timer:
#   "$HERDR_BIN_PATH" plugin action invoke githerd.sync >/dev/null
[[actions]]
id = "sync"
title = "githerd sync"
contexts = ["global"]
command = ["./bin/githerd", "herdr", "sync"]

# The rail: every repo under the root, refreshed every 30 seconds.
[[panes]]
id = "rail"
title = "githerd"
placement = "split"
command = ["./bin/githerd", "rail"]
